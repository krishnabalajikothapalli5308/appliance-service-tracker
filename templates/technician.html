<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appliance Service Tracker – Technician View</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🔧</div>
      <div>
        <div class="brand-title">ServiceTrack</div>
        <div class="brand-sub">Technician Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-link active">🛠 My Jobs</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/" class="switch-btn">← Switch to Admin View</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">Technician Dashboard</div>
      <div class="topbar-time" id="topbar-time"></div>
    </header>

    <section class="section active">
      <div class="section-toolbar">
        <select id="tech-filter" onchange="loadTechJobs()" class="filter-select">
          <option value="">Select Technician...</option>
        </select>
        <select id="status-filter" onchange="loadTechJobs()" class="filter-select">
          <option value="">All Status</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div class="table-card">
        <div class="table-header">Assigned Service Requests</div>
        <table class="data-table">
          <thead><tr><th>#</th><th>Appliance</th><th>Model</th><th>Issue</th><th>Priority</th><th>Status</th><th>Notes</th><th>Update</th></tr></thead>
          <tbody id="tech-table">
            <tr><td colspan="8" class="loading">Select a technician above to view jobs</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Update Status Modal -->
  <div id="modal-update" class="modal-overlay" onclick="closeModalOnOverlay(event,'modal-update')">
    <div class="modal">
      <div class="modal-title">Update Job Status</div>
      <div class="form-group"><label>Status</label>
        <select id="update-status" class="form-input">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="form-group"><label>Notes / Remarks</label>
        <textarea id="update-notes" class="form-input" rows="3" placeholder="Add service notes..."></textarea>
      </div>
      <input type="hidden" id="update-req-id" />
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('modal-update')">Cancel</button>
        <button class="btn btn-primary" onclick="submitUpdate()">Update</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/js/technician.js"></script>
</body>
</html>
